name: Nightly rebuild

on:
  schedule:
    - cron: '30 9 * * *'   # 4:30 am Eastern (5:30 in summer)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # commit temps.json and COVERAGE.md back
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # RunSignup's API contract bars keeping a bulk copy of their data, so
      # the snapshot lives only in the Actions cache, never in git.
      - name: Restore last RunSignup snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/runsignup.json
          key: runsignup-${{ github.run_id }}
          restore-keys: runsignup-

      - name: Fetch RunSignup listings
        env:
          RSU_API_REG: ${{ secrets.RSU_API_REG }}
          RSU_API_REG_SECRET: ${{ secrets.RSU_API_REG_SECRET }}
        run: node fetch-runsignup.mjs || echo "::warning::RunSignup fetch failed; building from the last snapshot"

      - name: Save RunSignup snapshot
        if: hashFiles('data/runsignup.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/runsignup.json
          key: runsignup-${{ github.run_id }}

      # NOAA 1991-2020 daily normals archive (165 MB), only unpacked when new
      # race locations need a lookup
      - name: Restore NOAA normals archive
        uses: actions/cache@v4
        with:
          path: data/noaa/daily-temperature.tar.gz
          key: noaa-normals-1991-2020-v1.0.1

      - name: Build, fill missing temps, build again
        run: |
          node build.mjs
          node normals.mjs || echo "::warning::NOAA normals step failed; using cached normals"
          node temps.mjs || echo "::warning::Open-Meteo fallback stopped early; the rest fills in next run"
          node build.mjs

      - name: Commit temps and coverage changes
        run: |
          git config user.name "race-planner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temps.json normals.json elevations.json COVERAGE.md
          git diff --cached --quiet || (git commit -m "Nightly refresh: temps and coverage" && git pull --rebase && git push)

      - name: Stage the page
        run: mkdir -p site && cp index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
